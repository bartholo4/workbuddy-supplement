name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline unit & hygiene tests
        run: python -m unittest discover -s tests -v
